<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timestamped Notebook</title>
<style>
  :root{color-scheme:light;--bg:#f6f6f4;--panel:#fff;--line:#e4e4e0;--muted:#8a8a85;--text:#1f1f1d;--accent:#2563eb}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header,footer{background:var(--panel);padding:.6rem 16px}
  header{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  footer{border-top:1px solid var(--line)}
  #clock{font:600 1.5rem/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;margin-right:auto}
  button{font:inherit;font-size:.85rem;padding:.35rem .75rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);cursor:pointer}
  button:hover{border-color:var(--muted)}
  #toggle{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  #notes{list-style:none;margin:0 auto;padding:1rem 16px;max-width:760px}
  #notes li{white-space:pre-wrap;overflow-wrap:anywhere;padding:.45rem .75rem;margin:.3rem 0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  #notes time{color:var(--muted);font:.85em ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  #notes.inline li{padding-left:calc(.75rem + 3.6rem + .3em);text-indent:calc(-3.6rem - .3em)}
  #notes.inline time{display:inline-block;width:3.6rem;text-align:right;text-indent:0}
  #notes.rows time{display:block;margin-bottom:.1rem}
  #line{display:block;width:100%;max-width:760px;margin:0 auto;font:inherit;padding:.6rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
  #line:focus{border-color:var(--accent);background:var(--panel)}
</style>
</head>
<body>
<header>
  <span id="clock">00:00</span>
  <button id="toggle">Start</button>
  <button id="reset">Reset</button>
  <button id="layout"></button>
  <button id="lang"></button>
</header>
<main><ul id="notes"></ul></main>
<footer><input id="line" autofocus></footer>
<script>
const $ = id => document.getElementById(id);
const KEY = 'tsnb';
let S = { acc: 0, t0: null, notes: [], layout: 'inline', lang: 'en' };
const T = {
  en: { start: 'Start', pause: 'Pause', reset: 'Reset', inline: 'Layout: inline', rows: 'Layout: rows', lang: '中文', line: 'Type a note, press Enter', confirm: 'Clear timer and all notes?' },
  zh: { start: '开始', pause: '暂停', reset: '重置', inline: '布局：行内', rows: '布局：分行', lang: 'EN', line: '输入笔记，按回车', confirm: '清除计时器和所有笔记？' },
};
const t = k => T[S.lang][k];

const elapsed = () => S.acc + (S.t0 ? Date.now() - S.t0 : 0);
const fmt = ms => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), p = n => String(n).padStart(2, '0');
  return (h ? h + ':' : '') + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
};

function render() {
  $('clock').textContent = fmt(elapsed());
  $('toggle').textContent = t(S.t0 ? 'pause' : 'start');
}
const scrollBottom = () => { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; };
function renderNotes() {
  $('notes').className = S.layout;
  $('layout').textContent = t(S.layout);
  $('reset').textContent = t('reset');
  $('lang').textContent = t('lang');
  $('line').placeholder = t('line');
  document.documentElement.lang = S.lang;
  $('notes').replaceChildren(...S.notes.map(([t, text]) => {
    const li = document.createElement('li'), time = document.createElement('time');
    time.textContent = fmt(t);
    li.append(time, S.layout === 'inline' ? ' ' + text : text);
    return li;
  }));
}

const b64 = u8 => btoa(u8.reduce((s, c) => s + String.fromCharCode(c), '')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());

let urlTimer;
function save() {
  localStorage.setItem(KEY, JSON.stringify(S));
  clearTimeout(urlTimer);
  urlTimer = setTimeout(async () => {
    const z = await pipe(new TextEncoder().encode(JSON.stringify(S)), new CompressionStream('deflate-raw'));
    history.replaceState(null, '', '#' + b64(z));
  }, 3000);
}
async function load() {
  const h = location.hash.slice(1);
  try {
    if (h) S = JSON.parse(new TextDecoder().decode(await pipe(unb64(h), new DecompressionStream('deflate-raw'))));
    else S = JSON.parse(localStorage.getItem(KEY)) || S;
  } catch {}
}

$('toggle').onclick = () => { if (S.t0) { S.acc += Date.now() - S.t0; S.t0 = null; } else S.t0 = Date.now(); render(); save(); };
$('reset').onclick = () => { if (!confirm(t('confirm'))) return; S = { ...S, acc: 0, t0: null, notes: [] }; render(); renderNotes(); save(); };
$('layout').onclick = () => { S.layout = S.layout === 'inline' ? 'rows' : 'inline'; renderNotes(); save(); };
$('lang').onclick = () => { S.lang = S.lang === 'en' ? 'zh' : 'en'; render(); renderNotes(); save(); };
$('line').onkeydown = e => {
  const text = e.target.value.trim();
  if (e.key !== 'Enter' || !text) return;
  S.notes.push([elapsed(), text]); e.target.value = '';
  renderNotes(); save(); scrollBottom();
};
load().then(() => { if (location.hash) save(); render(); renderNotes(); scrollBottom(); setInterval(render, 250); });
</script>
</body>
</html>
